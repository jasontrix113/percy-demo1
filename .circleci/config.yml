# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,deps:node:.
version: 2.1
orbs:
  node: circleci/node@5
jobs:
  test-node:
    # Install node dependencies and run tests
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
        name: Run Percy Tests
        command: npm run percy
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libx11-xcb1 \
              libxcomposite1 \
              libxcursor1 \
              libxdamage1 \
              libxi6 \
              libxrandr2 \
              libgbm1 \
              libasound2 \
              libpangocairo-1.0-0 \
              libgtk-3-0 \
              xvfb  # Required for Cypress

      - run: 
          name: Install dependencies
          command: npm install
      
    check_percy_approval:
      executor: default
      steps:
      - run:
          name: Check Percy Build Status
          command: |
            PERCY_BUILD_ID=$(curl -s "https://percy.io/api/v1/projects/734c002e/web/my-website-bf05414f/builds?filter=latest" \
            -H "Authorization: Token web_f2021df379314467a41f42ce4438ae2c9c6236aeb772e4a9c5a36fc75eaf0aae" | jq -r '.data[0].id')

            PERCY_STATUS=$(curl -s "https://percy.io/api/v1/builds/$PERCY_BUILD_ID" \
            -H "Authorization: Token web_f2021df379314467a41f42ce4438ae2c9c6236aeb772e4a9c5a36fc75eaf0aae" | jq -r '.data.attributes.state')

            if [ "$PERCY_STATUS" == "approved" ]; then
              echo "Percy build approved. Proceeding with deployment..."
              exit 0
            else
              echo "Percy build not approved. Stopping deployment."
              exit 1
            fi

  deploy:
    executor: default
    steps:
      - run:
          name: Deploy Application
          command: ./deploy.sh 

workflows:
  version: 2
  deploy_after_percy_approval:
    jobs:
      - test
      - check_percy_approval:
          requires:
            - test
      - deploy:
          requires:
            - check_percy_approval